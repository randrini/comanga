version: "3.8"

services:
  comanga:
    build: .
    container_name: comanga
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - comanga-data:/app/data
      - ${MEDIA_ROOT:-/media/comics}:/media:rw
    environment:
      - DATABASE_URL=/app/data/comanga.db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - SLSKD_URL=${SLSKD_URL:-http://slskd:5030}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      - PROWLARR_URL=${PROWLARR_URL:-http://prowlarr:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - QBITTORRENT_URL=${QBITTORRENT_URL:-http://qbittorrent:8080}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME:-admin}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - SABNZBD_URL=${SABNZBD_URL:-http://sabnzbd:8080}
      - SABNZBD_API_KEY=${SABNZBD_API_KEY}
      - COMICVINE_API_KEY=${COMICVINE_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: comanga-redis
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

